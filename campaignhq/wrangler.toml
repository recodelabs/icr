# Campaign Dashboards on Cloudflare: a Worker that serves the Framework build from the
# `icr` R2 bucket at https://dashboards.healthcampaigns.org.
# Deploy with ./deploy.sh (build → sync dist/ to R2 → wrangler deploy).
name = "campaignhq"
main = "worker/index.js"
compatibility_date = "2026-09-01"
account_id = "af8ac7eb1f7ec617e14702e69ce0d4c7"
workers_dev = false

[[r2_buckets]]
binding = "ICR"
bucket_name = "icr"

# Custom domains on the healthcampaigns.org zone (same account). Wrangler creates
# the DNS record and certificate for a custom_domain route on deploy. The old
# monitor.* host is kept attached so the Worker can 301-redirect it (see
# CANONICAL_HOST in worker/index.js) rather than leaving it dangling.
[[routes]]
pattern = "dashboards.healthcampaigns.org"
custom_domain = true

[[routes]]
pattern = "monitor.healthcampaigns.org"
custom_domain = true
