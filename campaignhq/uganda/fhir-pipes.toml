# fhir-pipes settings for the Uganda dashboards' data (warehouse/, not in git): the Uganda ICR
# server's locations and the IG's ViewDefinitions over its campaigns, targets and tasks.
# Paths are relative to this file. refresh.sh runs it with the Uganda API key.

data = "warehouse"
views = "../../ig/fsh-generated/resources"
profile = "../../ig/fhir-pipes-profile.toml"

[server]
base = "https://fhir-uga.healthcampaigns.org/fhir"
name = "uga"
token_url = "https://auth.healthcampaigns.org/realms/uga/protocol/openid-connect/token"

[tables]
# IcrCampaignActivity → campaign_activity
strip_prefix = ["icr_"]

[partition]
column = "country"

[[partition.lookup]]
key = "location_id"
table = "locations"
table_key = "id"

[[partition.lookup]]
key = "campaign_id"
table = "campaign_calendar"

# Boundary tiles for the maps (country, regions, districts).
[tiles]
countries = ["UGA"]
