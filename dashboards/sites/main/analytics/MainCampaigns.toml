kind = "SQLQuery"
title = "Campaigns with their targets and results"
description = """
One row per campaign: its level, programme, administrative unit and state, people targeted
(the planning denominator, else the largest per-activity target), the per-activity targets,
and its results: administrative coverage (reconciled), the latest realtime figure, the LQAS
verdict and the survey estimate. The SQL is DuckDB's.
"""

