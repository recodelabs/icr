name: Publish IG to Cloudflare Pages

# Builds the FHIR IG (sushi → HL7 IG Publisher) and publishes the STOCK rendering
# to both Pages projects:
#
#   ig/output → https://icr-ig-standard.pages.dev  — stock HL7 IG Publisher
#               rendering, the layout HL7 reviewers expect.
#   ig/output → https://icr-ig.pages.dev           — same stock rendering; this
#               project carries the custom domain icr.healthcampaigns.org.
#
# IG Topcoat is DISABLED for now (Matt, 2026-08-11): its re-render has gaps
# against the stock IG viewer. To re-enable: restore the commented Topcoat steps
# below and point the icr-ig deploy back at _site.
#
# Deploy requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — af8ac7eb1f7ec617e14702e69ce0d4c7
# Until they exist, the workflow still builds both sites and uploads them as run
# artifacts; the deploy steps are skipped.
on:
  push:
    branches: [main]
    paths:
      - "ig/**"
      - ".github/workflows/publish-ig.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ig
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout icr
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll and SUSHI
        run: |
          gem install jekyll --no-document
          npm install -g fsh-sushi

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: fhir-packages-

      - name: Cache IG Publisher jar
        id: cache-publisher
        uses: actions/cache@v4
        with:
          path: ig/input-cache/publisher.jar
          key: ig-publisher-${{ github.run_number }}
          restore-keys: ig-publisher-

      - name: Download IG Publisher
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        run: cd ig && ./_updatePublisher.sh

      - name: Build IG (sushi + IG Publisher)
        run: cd ig && ./_genonce.sh

      # Publish the stock rendering before Topcoat runs, so it is captured as the
      # IG Publisher emitted it.
      - name: Upload standard IG as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: icr-ig-standard
          path: ig/output
          retention-days: 7

      # Cloudflare Pages rejects any file over 25 MiB. full-ig.zip (the whole-IG
      # download the Publisher emits) crossed that line on 2026-09-06 and failed the
      # deploy; it is kept in the run artifact above but dropped from the sites.
      - name: Drop files over Cloudflare Pages' 25 MiB limit
        run: |
          rm -f ig/output/full-ig.zip
          find ig/output -type f -size +25M -print -delete

      - name: Deploy standard IG to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ig/output --project-name=icr-ig-standard --branch=main

      # --- IG Topcoat disabled for now (2026-08-11) — re-enable by restoring
      # --- these steps and deploying _site (not ig/output) to icr-ig.
      #
      # - name: Render modern site with IG Topcoat
      #   uses: recodelabs/ig-topcoat@v1
      #   with:
      #     input: ig/output
      #     output: _site
      #
      # - name: Upload site as run artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: icr-ig-site
      #     path: _site
      #     retention-days: 7

      - name: Deploy to Cloudflare Pages (custom domain icr.healthcampaigns.org)
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ig/output --project-name=icr-ig --branch=main
