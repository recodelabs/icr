<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="dg" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-label="Example of one country&#x27;s NTD programme: what each system sends to the ICR and what it gets back.">
<title>Example of one country&#x27;s NTD programme: what each system sends to the ICR and what it gets back.</title>
<style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap');
.bg{fill:var(--d-paper,#FAF8F3)}
.grid{fill:none;stroke:var(--d-ghost,rgba(14,14,12,.055));stroke-width:1}
.box{fill:var(--d-surface,#F4F1E9);stroke:var(--d-ink,#0E0E0C);stroke-width:1.25}
.icr{fill:var(--d-paper,#FAF8F3);stroke:var(--d-accent,#F16427);stroke-width:1.5;stroke-dasharray:7 4}
.cell{fill:var(--d-surface,#F4F1E9);stroke:var(--d-ink,#0E0E0C);stroke-width:1}
.group{fill:none;stroke:var(--d-ink2,#45453F);stroke-width:1;stroke-dasharray:5 4}
.chip{fill:var(--d-paper,#FAF8F3);stroke:var(--d-hair,rgba(14,14,12,.3));stroke-width:1}
.wire{fill:none;stroke:var(--d-ink2,#45453F);stroke-width:1.25}
.rule{stroke:var(--d-hair,rgba(14,14,12,.3));stroke-width:1}
.ah-in,.dot-in,.mk-on,.bar{fill:var(--d-accent,#F16427)}
.ah-out,.dot-out{fill:var(--d-ink,#0E0E0C)}
.hl{fill:none;stroke:var(--d-accent,#F16427);stroke-width:2.5}
.tint{fill:var(--d-tint,rgba(241,100,39,.13))}
.mk-off{fill:var(--d-faint,#D6CFBD)}
.dg text{font-family:Manrope,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--d-ink,#0E0E0C)}
.dg .name{font-size:15px;font-weight:700}
.dg .sub{font-size:11.5px;fill:var(--d-ink2,#45453F)}
.dg .body{font-size:11px}
.dg .mono,.dg .code{font-family:'JetBrains Mono',Menlo,Consolas,monospace}
.dg .mono{font-size:9.5px;letter-spacing:.08em}
.dg .code{font-size:9px;fill:var(--d-muted,#6B6B63)}
.dg .muted{fill:var(--d-muted,#6B6B63)}
.dg .h-in{fill:var(--d-accent-ink,#A13A10);font-weight:500}
.dg .h-out{font-weight:500}
.dg .serif{font-family:'Source Serif 4','Times New Roman',serif;font-weight:600}
.dg .caption{font-size:15px;font-weight:500}
.dg .cellname{font-size:13px;font-weight:700}
]]></style>
<defs><pattern id="c-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern><marker id="c-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-in" d="M0,1 L10,5 L0,9 z"/></marker><marker id="c-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-out" d="M0,1 L10,5 L0,9 z"/></marker></defs>
<rect class="bg" width="1280" height="840"/><rect fill="url(#c-grid)" width="1280" height="840"/>
<text class="mono muted" x="40" y="44">EXAMPLE · DATA IN AND OUT OF THE ICR IN ONE COUNTRY&#x27;S NTD PROGRAMME</text>
<rect class="group" x="560" y="64" width="676" height="216" rx="6"/>
<text class="mono" x="580" y="90">SIGHTSAVERS</text>
<text class="sub" x="580" y="108">NGO running the NTD programme</text>
<path class="wire" d="M470,812 h34" marker-end="url(#c-in)"/><text class="sub" x="514" y="816">data going into the ICR</text><path class="wire" d="M680,812 h34" marker-end="url(#c-out)"/><text class="sub" x="724" y="816">data going out of the ICR, or between tools</text>
<path id="c-cc-cs" class="wire" d="M980,210 L840,210" marker-end="url(#c-out)"/>
<text class="body" x="910" y="202" text-anchor="middle">delivery data</text>
<path id="c-cc-mb" class="wire" d="M1095,180 L1095,140" marker-end="url(#c-out)"/>
<text class="body" x="1105" y="164">reports</text>
<path id="c-icf" class="wire" d="M270,135 L470,480" marker-start="url(#c-out)" marker-end="url(#c-in)"/>
<path id="c-digit" class="wire" d="M270,735 L470,585" marker-start="url(#c-out)" marker-end="url(#c-in)"/>
<path id="c-cs" class="wire" d="M720,240 L720,450" marker-start="url(#c-out)" marker-end="url(#c-in)"/>
<path id="c-cc" class="wire" d="M1120,240 L810,525" marker-end="url(#c-in)"/>
<path id="c-mb" class="wire" d="M1210,110 L1252,110 L1252,565 L810,565" marker-end="url(#c-in)"/>
<path id="c-dhis2" class="wire" d="M1000,750 L760,600" marker-end="url(#c-in)"/>
<rect class="box" x="980" y="80" width="230" height="60" rx="3"/><text class="name" x="994" y="107">Metabase</text><text class="sub" x="994" y="126">Programme dashboards</text>
<rect class="box" x="600" y="180" width="240" height="60" rx="3"/><text class="name" x="614" y="207">Crosscut</text><text class="sub" x="614" y="226">Planning</text>
<rect class="box" x="980" y="180" width="230" height="60" rx="3"/><text class="name" x="994" y="207">CommCare</text><text class="sub" x="994" y="226">Collection</text>
<rect class="box" x="40" y="90" width="230" height="60" rx="3"/><text class="name" x="54" y="125.0">ICF</text>
<rect class="box" x="40" y="720" width="230" height="60" rx="3"/><text class="name" x="54" y="747">DIGIT</text><text class="sub" x="54" y="766">Malaria</text>
<rect class="box" x="1000" y="720" width="230" height="60" rx="3"/><text class="name" x="1014" y="747">DHIS2</text><text class="sub" x="1014" y="766">National HMIS</text>
<rect class="icr" x="470" y="450" width="340" height="150" rx="4"/>
<text class="serif" x="486" y="482" font-size="24">ICR</text><text class="sub" x="536" y="481">registry and system of record</text>
<rect class="cell" x="486.0" y="506" width="97.33333333333333" height="78" rx="2"/><text class="cellname" x="534.6666666666666" y="541.0" text-anchor="middle">Location</text><text class="cellname" x="534.6666666666666" y="557.0" text-anchor="middle">registry</text>
<rect class="cell" x="591.3333333333334" y="506" width="97.33333333333333" height="78" rx="2"/><text class="cellname" x="640.0" y="541.0" text-anchor="middle">Campaign</text><text class="cellname" x="640.0" y="557.0" text-anchor="middle">data</text>
<rect class="cell" x="696.6666666666666" y="506" width="97.33333333333333" height="78" rx="2"/><text class="cellname" x="745.3333333333333" y="549.0" text-anchor="middle">Terminology</text>
<rect class="chip" x="252" y="257.5" width="236" height="99" rx="2"/>
<text class="mono h-out" x="264" y="274.5">ICR → ICF</text><text class="body" x="264" y="289.5">locations · populations</text><text class="body" x="264" y="304.5">indicators · Crosscut catchments</text>
<text class="mono h-in" x="264" y="326.5">ICF → ICR</text><text class="body" x="264" y="341.5">campaign data</text>
<rect class="chip" x="254" y="612.5" width="216" height="99" rx="2"/>
<text class="mono h-out" x="266" y="629.5">ICR → DIGIT</text><text class="body" x="266" y="644.5">locations · populations</text><text class="body" x="266" y="659.5">indicators</text>
<text class="mono h-in" x="266" y="681.5">DIGIT → ICR</text><text class="body" x="266" y="696.5">campaign data</text>
<rect class="chip" x="594" y="288" width="252" height="114" rx="2"/>
<text class="mono h-out" x="606" y="305">ICR → CROSSCUT</text><text class="body" x="606" y="320">locations · populations · indicators</text>
<text class="mono h-in" x="606" y="342">CROSSCUT → ICR</text><text class="body" x="606" y="357">catchment areas, added to</text><text class="body" x="606" y="372">the location registry</text><text class="body" x="606" y="387">hard-to-reach communities</text>
<rect class="chip" x="891" y="323" width="210" height="62" rx="2"/>
<text class="mono h-in" x="903" y="340">COMMCARE → ICR</text><text class="body" x="903" y="355">campaign data</text><text class="body" x="903" y="370">supervision coverage</text>
<rect class="chip" x="950" y="541.5" width="160" height="47" rx="2"/>
<text class="mono h-in" x="962" y="558.5">METABASE → ICR</text><text class="body" x="962" y="573.5">historical data</text>
<rect class="chip" x="782" y="651.5" width="196" height="47" rx="2"/>
<text class="mono h-in" x="794" y="668.5">DHIS2 → ICR</text><text class="body" x="794" y="683.5">org units · routine data</text>
</svg>