# A named ICR server on the Helios FHIR Server (hfs) instead of HAPI. One compose project per
# instance (icr-<SERVER>), each with its own hfs, Postgres, FHIR Info Gateway and daily backup,
# behind the main stack's Caddy. The instance name is free — a country (uga), a programme, a
# tenant, whatever. This is the go-forward template for ICR servers; hfs.sh drives it.
#
#   https://$FHIR_HOST/fhir   the gateway (API key required; /fhir/metadata is open)
#
# hfs serves the FHIR base at root (/metadata); the gateway exposes it at /fhir and strips the
# prefix forwarding to PROXY_TO, so the public base is …/fhir, identical to HAPI. First boot
# seeds ~1,372 spec SearchParameters into Postgres (a minute or two) before it listens.
#
# Run from /opt/icr-hapi/gcp on the VM via hfs.sh (or directly):
#   sudo docker compose -p icr-<name> -f hfs/docker-compose.yml --env-file hfs/<name>.env up -d
name: icr-${SERVER:?set in the env file}
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fhir
      POSTGRES_USER: hfs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in the env file}
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfs -d fhir"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Helios FHIR Server, Postgres backend. Reached only through the gateway; HFS_BASE_URL is the
  # internal proxy target (= the gateway's PROXY_TO), which the gateway rewrites to its public
  # base so paging/Bundle links come out right. The service stays `hfs` (not `<name>-hfs`): it is
  # only on this instance's own network, so it never collides with another instance's.
  hfs:
    image: ghcr.io/heliossoftware/hfs:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HFS_STORAGE_BACKEND: postgres
      HFS_DATABASE_URL: postgresql://hfs:${POSTGRES_PASSWORD}@db:5432/fhir
      HFS_SERVER_HOST: 0.0.0.0
      HFS_SERVER_PORT: "8080"
      HFS_BASE_URL: http://hfs:8080
      HFS_DEFAULT_FHIR_VERSION: R4
      HFS_LOG_LEVEL: info
      # auth is handled by the gateway in front, so hfs itself stays open
      HFS_AUTH_ENABLED: "false"

  # Same image/settings as the main stack's gateway; tokens must come from this instance's realm
  # (TOKEN_ISSUER), so a key for one instance opens no other. BACKEND_TYPE HAPI = plain FHIR REST
  # passthrough. Joins the shared network as <SERVER>-gateway, which sites/<SERVER>.caddy proxies to.
  gateway:
    image: us-docker.pkg.dev/fhir-proxy-build/stable/fhir-gateway:v0.5.0
    restart: unless-stopped
    depends_on:
      hfs:
        condition: service_started
    environment:
      PROXY_TO: http://hfs:8080
      TOKEN_ISSUER: ${TOKEN_ISSUER:?set in the env file}
      BACKEND_TYPE: HAPI
      ACCESS_CHECKER: list
      RUN_MODE: PROD
      ALLOWED_QUERIES_FILE: /config/allowed-queries.json
      JAVA_TOOL_OPTIONS: -Xmx384m
    volumes:
      - ../gateway/allowed-queries.json:/config/allowed-queries.json:ro
    networks:
      default:
      shared:
        aliases: ["${SERVER}-gateway"]

  # A pg_dump into the backups volume once a day after 02:00 UTC, the last 14 kept.
  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: hfs
      PGDATABASE: fhir
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SERVER: ${SERVER}
    entrypoint:
      - sh
      - -c
      - |
        set -o pipefail
        while true; do
          f=/backups/$$SERVER-$$(date -u +%Y%m%d).sql.gz
          if [ ! -f $$f ] && [ $$(date -u +%H) -ge 2 ]; then
            pg_dump | gzip > $$f.tmp && mv $$f.tmp $$f && echo "backup $$f" || rm -f $$f.tmp
            ls -1t /backups/*.sql.gz | tail -n +15 | xargs -r rm --
          fi
          sleep 600
        done
    volumes:
      - backups:/backups

networks:
  shared:
    external: true
    name: ${MAIN_NETWORK:-icr-hapi_default}   # the main stack's network (project icr-hapi)

volumes:
  pgdata:
  backups:
