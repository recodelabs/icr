# Match-bot (https://github.com/crosscutio/field-kit/tree/main/match-bot) at
# https://matchbot.healthcampaigns.org, behind Keycloak sign-in (realm matchbot on
# auth.healthcampaigns.org) through oauth2-proxy. Only the proxy joins the main stack's network,
# where Caddy (sites/matchbot.caddy) reaches it; match-bot itself has no other way in.
# Run with ../matchbot.sh; settings in matchbot.env (see matchbot.env.example).
name: icr-matchbot
services:
  app:
    build: .
    image: icr-matchbot:local
    restart: unless-stopped
    volumes:
      - uploads:/opt/field-kit/match-bot/instance
      - gazetteer:/data/gazetteer
    networks: [internal]
    mem_limit: 3g

  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: unless-stopped
    depends_on: [app]
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${AUTH_HOST:?set in matchbot.env}/realms/${REALM:-matchbot}
      OAUTH2_PROXY_CLIENT_ID: matchbot
      OAUTH2_PROXY_CLIENT_SECRET: ${CLIENT_SECRET:?set in matchbot.env}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET:?set in matchbot.env}
      OAUTH2_PROXY_REDIRECT_URL: https://${HOST:?set in matchbot.env}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://app:5000/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"           # anyone with an account in the realm
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 12h
      # uploads of large shapefiles and GeoJSON
      OAUTH2_PROXY_UPSTREAM_TIMEOUT: 600s
    networks:
      internal: {}
      main:
        aliases: [matchbot-proxy]

  # The app never removes old sessions' uploads; this deletes any older than 14 days, daily.
  cleanup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - uploads:/uploads
    # /uploads is the app's instance folder: uploads/<session id>/
    command: ["sh", "-c", "while true; do for d in /uploads/uploads; do [ -d \"$$d\" ] && find \"$$d\" -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +; done; sleep 86400; done"]
    networks: [internal]

volumes:
  uploads:
  gazetteer:

networks:
  internal: {}
  main:
    external: true
    name: ${MAIN_NETWORK:-icr-hapi_default}
