[project]
name = "icr-mcp"
version = "0.1.0"
description = "MCP server for the saved queries of data.healthcampaigns.org (fhir-pipes serve)"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
