name = "icr-digit"
title = "DIGIT HCM to the Integrated Campaign Registry"

# The records are DIGIT search results as the API returns them: most
# members are null when not set, and they carry audit details, row versions
# and other members the mapping does not read. The models describe what the
# package reads; nulls are read as absent and the other members are left out.
[records]
null = "absent"
unknown = "ignore"

# The views BoundaryTree, Boundary and Facility read the boundary trees and
# the facilities from their record files, not from staged resources: a view
# over a record type goes beyond the SQL on FHIR specification, so it has to
# be allowed.
[views]
records = "allow"

# Every boundary of every hierarchy, with its hierarchy, level and parent,
# each parent before its children. The Library reads the views BoundaryTree
# and Boundary, which read the boundary trees.
[[step]]
library = "DigitBoundary"

# Boundaries: an admin-unit Location each, to the output.
[[step]]
map = "DIGITBoundaryToICR"
from = { library = "DigitBoundary" }

# Each facility once, with its boundary when that boundary was exported, in
# the order of facility.ndjson. The Library reads the views Boundary and
# Facility, which read the record files.
[[step]]
library = "DigitFacility"

# The facilities whose boundary was not exported: the run report counts them.
[[step]]
library = "DigitFacilityLocalityNotExported"

# Facilities: a Location and an Organization each, to the output.
[[step]]
map = "DIGITFacilityToICR"
from = { library = "DigitFacility" }

# The product catalogue: each product variant with its label, kind, standard
# code and unit, for the maps that write a product.
[[step]]
library = "DigitProductVariant"

# The target populations of the projects: a Group per target number.
[[step]]
library = "DigitTarget"

[[step]]
map = "DIGITTargetToICR"
from = { library = "DigitTarget" }

# The targets left out because their project's boundary was not exported,
# and the root project targets written without a geography: the run report
# counts them.
[[step]]
library = "DigitTargetBoundaryNotExported"

[[step]]
library = "DigitTargetWithoutGeography"

# The campaign activities: an ActivityDefinition per project type, delivery
# and product variant, with the product from the catalogue.
[[step]]
library = "DigitActivity"

[[step]]
map = "DIGITActivityToICR"
from = { library = "DigitActivity" }

# The project types: a PlanDefinition each, with an action per activity, and
# a Group for the eligible age band when there is one.
[[step]]
library = "DigitProtocol"

[[step]]
map = "DIGITProtocolToICR"
from = { library = "DigitProtocol" }

# The campaigns: a CarePlan per root project, and one per cycle when it has
# more than one.
[[step]]
library = "DigitCampaign"

[[step]]
map = "DIGITCampaignToICR"
from = { library = "DigitCampaign" }

# The root projects not written as a campaign, with the reason: the run
# report counts them.
[[step]]
library = "DigitCampaignNotImported"

[[test]]
name = "one row per facility"
library = "DigitFacility"
unique = ["id"]

[[test]]
name = "one boundary per Location id"
sql = """
SELECT regexp_replace(code, '[^A-Za-z0-9.-]', '-', 'g') AS location_id, count(*) AS boundaries
FROM boundary
GROUP BY 1
HAVING count(*) > 1
"""

[[test]]
name = "one project per id"
library = "DigitProject"
unique = ["id"]

[[test]]
name = "one target Group per id"
library = "DigitTarget"
unique = ["id"]

[[test]]
name = "one PlanDefinition per id"
library = "DigitProtocol"
unique = ["id"]

[[test]]
name = "one CarePlan per id"
library = "DigitCampaign"
unique = ["id"]
