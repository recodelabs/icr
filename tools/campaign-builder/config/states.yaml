# States, LGAs and population inputs for the Nigeria demo calendar.
#
# LGA ids are the registry Location ids (state code + GRID3 lgacode) as loaded
# in the local HAPI on 2026-09-06 (see tools/hapi). Names are the registry names.
#
# Population: 2006 census (NPC) and the 2022 NPC projection, both as published
# on citypopulation.de (accessed 2026-09-07). Any other year is interpolated /
# extrapolated geometrically from those two points per LGA. This is the
# "estimate we could find" placeholder; the plan is to replace it with WorldPop
# grids aggregated to LGA boundaries in a second step (denominator-source then
# becomes `worldpop`).

country_location: nga
canonical_base: https://icr.healthcampaigns.org

# Age-band fractions of total population, northern-Nigeria shaped (high
# fertility: ~18% under five, ~44% under fifteen). Fractions are applied to the
# LGA total for the round year. Ranges are what goes on the Group
# characteristic; units are UCUM (`mo` months, `a` years).
age_bands:
  under5:      {label: "Children 0–59 months",          low: 0,  low_unit: mo, high: 59, high_unit: mo, fraction: 0.185}
  m6_59:       {label: "Children 6–59 months",          low: 6,  low_unit: mo, high: 59, high_unit: mo, fraction: 0.175}
  m9_59:       {label: "Children 9–59 months",          low: 9,  low_unit: mo, high: 59, high_unit: mo, fraction: 0.160}
  m9_y14:      {label: "Children 9 months–14 years",    low: 9,  low_unit: mo, high: 14, high_unit: a,  fraction: 0.440}
  y5_14:       {label: "School-age children 5–14 years", low: 5, low_unit: a,  high: 14, high_unit: a,  fraction: 0.300}
  y5_plus:     {label: "Population 5 years and older",  low: 5,  low_unit: a,  high: null, high_unit: a, fraction: 0.815}
  m6_plus:     {label: "Population 6 months and older", low: 6,  low_unit: mo, high: null, high_unit: a, fraction: 0.985}

