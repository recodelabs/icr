[project]
name = "campaign-builder"
version = "0.1.0"
description = "Synthetic-but-realistic ICR campaign calendar for five northern Nigerian states (CarePlan / PlanDefinition / Group NDJSON)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
campaign-builder = "campaign_builder.build:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["campaign_builder*"]
