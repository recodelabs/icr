# Portolan CLI configuration for the ICR catalog (data/ ⇄ r2:icr ⇄ https://sdi.healthcampaigns.org).
# The view tables are ICR-internal and not in the catalog; tabular stays on only so the CLI
# never refuses a plain-Parquet companion file.
tabular.enabled: 'true'

publish:
  public_url: https://sdi.healthcampaigns.org/
