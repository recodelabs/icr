# Portolan metadata for the `parquet/locations` collection.
#
# Source of truth for the collection's human-written metadata. kiln swaps in a
# fresh parquet/locations/ directory on every run, so tools/warehouse/refresh.sh
# copies this file to parquet/locations/.portolan/metadata.yaml before
# `portolan add`; edit it here, then `portolan readme parquet/locations`.

title: "ICR location registry"
description: |
  Every Location in the Integrated Campaign Registry (ICR) FHIR server, flattened
  to one GeoParquet row per resource: administrative boundaries (country, states,
  LGAs — polygons), health facilities and settlements (points), with the
  administrative hierarchy denormalised onto each row (admin0…admin4 names and
  codes, `path`, `ancestor_ids`) and the complete FHIR resource kept in
  `fhir_json`. Nigeria is complete (812 admin units, 51,022 facilities, 292,438
  settlements, from GRID3 and the NHFR via the ICR); Sierra Leone holds a
  handful of test records so far.

  Hive-partitioned by `country` / `geom_type` / `type`, one zstd-compressed file
  per partition, 20,000-row groups in Hilbert order with a `bbox` covering column
  and native Parquet GEOMETRY statistics, so a reader can fetch only the row
  groups it needs over HTTP range requests. Geometry is WGS 84 (OGC:CRS84) WKB.

contact:
  name: "Recode Labs — ICR team"
  email: "mberg@ona.io"

license: "CC-BY-4.0"

keywords: ["health facilities", "settlements", "administrative boundaries", "Nigeria", "Sierra Leone", "FHIR", "immunization", "campaigns", "GRID3"]
attribution: "UNICEF Integrated Campaign Registry · Recode Labs · GRID3"

source_url: "https://icr.healthcampaigns.org"
processing_notes: |
  Exported from the ICR FHIR server (HL7 FHIR R4 Location resources, profiled by
  the ICR Implementation Guide) with kiln (https://github.com/recodelabs/kiln):
  incremental `_lastUpdated` extract to an NDJSON snapshot, then a transform that
  resolves the `partOf` hierarchy, converts positions and boundary extensions to
  WKB, and writes the partitioned GeoParquet. FHIR stays the master; this table is
  a derived projection and is regenerated in full on each refresh
  (tools/warehouse/refresh.sh in the ICR repo). The collection datetime is the
  time of that snapshot.
known_issues: |
  1,653 Nigerian points fall outside the polygon of their `partOf` admin unit
  (source data quality; listed in parquet/_report.json). 3 facilities have no
  usable geometry and are dropped. `type=null` holds Locations without a type
  code. Sierra Leone is test data, not a registry. The PMTiles (rel="pmtiles"
  links) cover Nigeria only and are rebuilt separately from the parquet
  (tools/warehouse/tiles.sh), so they can lag a refresh. No thumbnail yet.

examples:
  - engine: duckdb
    description: "Health facilities per state (one partition, read over HTTP)"
    code: |
      SELECT admin1_name AS state, count(*) AS facilities
      FROM read_parquet('https://sdi.healthcampaigns.org/parquet/locations/country=NGA/geom_type=point/type=facility/part-0.parquet')
      GROUP BY 1 ORDER BY 2 DESC;
  - engine: duckdb
    description: "Settlements inside one LGA, using the bbox column to prune row groups"
    code: |
      INSTALL spatial; LOAD spatial;
      WITH lga AS (
        SELECT geometry, bbox FROM read_parquet('https://sdi.healthcampaigns.org/parquet/locations/country=NGA/geom_type=polygon/type=admin-unit/part-0.parquet')
        WHERE admin_level = 2 AND name = 'Kano Municipal')
      SELECT s.name, s.settlement_type, s.lon, s.lat
      FROM read_parquet('https://sdi.healthcampaigns.org/parquet/locations/country=NGA/geom_type=point/type=settlement/part-0.parquet') s, lga
      WHERE s.bbox.xmin BETWEEN lga.bbox.xmin AND lga.bbox.xmax
        AND s.bbox.ymin BETWEEN lga.bbox.ymin AND lga.bbox.ymax
        AND ST_Within(s.geometry, lga.geometry);
  - engine: python
    description: "Load the LGA boundaries with GeoPandas"
    code: |
      import geopandas as gpd
      lgas = gpd.read_parquet(
          "https://sdi.healthcampaigns.org/parquet/locations/country=NGA/geom_type=polygon/type=admin-unit/part-0.parquet"
      ).query("admin_level == 2")
      lgas.plot(column="admin1_name")
