# fhir-pipes settings for the DIGIT demo warehouse (warehouse/). DIGIT is a demo tenant, not a
# country: its server holds eGov's DIGIT HCM demo data (fake), transformed to ICR profiles (see
# project/digit.md). Paths are relative to this file. Run warehouse.sh, which assembles the
# views (build/views/) and runs:
#
#   FHIR_PIPES_CLIENT_ID=… FHIR_PIPES_CLIENT_SECRET=… \
#     fhir-pipes refresh --config country/digit/fhir-pipes.toml --only locations,views
#
# warehouse.sh --push uploads it to the digit/ folder of the `icr` R2 bucket. Unlike Uganda's
# folder, digit/ is not an SDI: it stays private, and there is no Portolan catalog.

data = "warehouse"

# The views are the IG's ViewDefinitions plus the DIGIT ones in views/ (delivery events, supply,
# households, people, locations, activities), which the IG does not have yet. warehouse.sh copies
# both into build/views/. The IG's come from ../../ig/fsh-generated/resources (or $IG_VIEWS).
views = "build/views"
profile = "../../ig/fhir-pipes-profile.toml"

[server]
base = "https://fhir-digit.healthcampaigns.org/fhir"
name = "digit"
token_url = "https://auth.healthcampaigns.org/realms/digit/protocol/openid-connect/token"

[tables]
# IcrCampaignActivity → campaign_activity; DigitSupplyDelivery → digit_supply_delivery
strip_prefix = ["icr_"]

# No [partition]: the main and Uganda warehouses partition every table by country, looked up
# from the location registry. DIGIT's boundaries carry no ISO or P-code, so the lookup gives no
# country, and the demo is one tenant anyway. Tables are written unpartitioned.

# No [tiles]: DIGIT holds no geometry. Only 168 Nigerian states and LGAs carry a boundary (GRID3,
# from the ICR's location registry). The site draws all of Nigeria's GRID3 states and LGAs (grid3_nga,
# copied in by warehouse.sh) as GeoJSON, and the facilities and dwellings from a parquet file.

# No [push]: fhir-pipes pushes to the root of a bucket, and this warehouse is the bucket's
# digit/ folder, so warehouse.sh --push uploads it with rclone.
