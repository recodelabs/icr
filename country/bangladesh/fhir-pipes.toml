# fhir-pipes settings for Bangladesh's warehouse (warehouse/): the Bangladesh ICR server's
# locations and the IG's ViewDefinitions over its campaign, indicators and values. Paths are
# relative to this file. Run warehouse.sh, which keeps the places without a boundary (see there).
#
# warehouse.sh --push uploads it to the bgd/ folder of the `icr` R2 bucket. That folder is
# private: there is no SDI for Bangladesh, and the dashboards need sign-in.

data = "warehouse"
views = "../../ig/fsh-generated/resources"
profile = "../../ig/fhir-pipes-profile.toml"

[server]
base = "https://fhir-bgd.healthcampaigns.org/fhir"
name = "bgd"
token_url = "https://auth.healthcampaigns.org/realms/bgd/protocol/openid-connect/token"

[tables]
# IcrIndicatorValue → indicator_value
strip_prefix = ["icr_"]

# Every view table is partitioned by country, as in the main warehouse.
[partition]
column = "country"

[[partition.lookup]]
key = "location_id"
table = "locations"
table_key = "id"

[[partition.lookup]]
key = "campaign_id"
table = "campaign_calendar"

# No [push]: fhir-pipes pushes to the root of a bucket, and this warehouse is the bucket's bgd/
# folder, so warehouse.sh --push uploads it with rclone. No tiles and no catalog hook: the
# dashboards draw the boundaries from the locations table, and nothing here is public.
