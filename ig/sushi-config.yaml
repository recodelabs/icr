# sushi-config.yaml — ICR FHIR Implementation Guide
# Built per https://build.fhir.org/ig/FHIR/ig-guidance/ using the FSH/SUSHI/IG-Publisher
# toolchain (the same toolchain WHO SMART Guidelines use — see working doc §11).
id: unicef.fhir.icr
canonical: https://fhir.icr.unicef.org
name: ICR
title: "Integrated Campaign Registry (ICR) Implementation Guide"
description: >-
  HL7 FHIR R4 Implementation Guide for UNICEF's Integrated Campaign Registry (ICR):
  a standards framework that lets public health campaigns (immunization SIAs, polio,
  NTD mass drug administration, malaria ITN/IRS, vitamin A) share, exchange, and reuse
  campaign data and metadata instead of re-collecting it every round. CarePlan is the
  architectural keystone: PlanDefinition carries the reusable campaign protocol,
  CarePlan the campaign execution, Task the operational unit of work, Group the
  households and target populations, and Location the administrative hierarchy and
  geospatial identity (Overture Maps GERS).
status: draft
