<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="dg" viewBox="0 0 1280 810" width="1280" height="810" role="img" aria-label="The ICR in a country&#x27;s campaign systems: campaign tools plan and collect, the ICR keeps the registry and the record, DHIS2 and the warehouse report.">
<title>The ICR in a country&#x27;s campaign systems: campaign tools plan and collect, the ICR keeps the registry and the record, DHIS2 and the warehouse report.</title>
<style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap');
.bg{fill:var(--d-paper,#F7F8F5)}
.box{fill:var(--d-surface,#EEF1EB);stroke:var(--d-ink,#17211C);stroke-width:1.25}
.icr{fill:var(--d-paper,#F7F8F5);stroke:var(--d-accent,#F16427);stroke-width:1.75;stroke-dasharray:7 4}
.cell{fill:var(--d-surface,#EEF1EB);stroke:var(--d-ink,#17211C);stroke-width:1}
.group{fill:none;stroke:var(--d-ink2,#4A554F);stroke-width:1;stroke-dasharray:5 4}
.chip{fill:var(--d-paper,#F7F8F5);stroke:var(--d-hair,#C9CFC7);stroke-width:1}
.wire{fill:none;stroke:var(--d-ink2,#4A554F);stroke-width:1.25}
.rule{stroke:var(--d-hair,#C9CFC7);stroke-width:1}
.ah-in,.dot-in,.mk-on,.hlbar{fill:var(--d-accent,#F16427)}
.ah-out,.dot-out{fill:var(--d-ink,#17211C)}
.hl{fill:none;stroke:var(--d-accent,#F16427);stroke-width:2.5}
.tint{fill:var(--d-tint,rgba(241,100,39,.13))}
.mk-off{fill:var(--d-faint,#D5DAD3)}
.dg text{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;fill:var(--d-ink,#17211C)}
.dg .name{font-size:15.5px;font-weight:600}
.dg .sub{font-size:12px;fill:var(--d-ink2,#4A554F)}
.dg .body{font-size:11.5px}
.dg .mono,.dg .code{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.dg .mono{font-size:9.5px;letter-spacing:.08em}
.dg .code{font-size:9px;fill:var(--d-muted,#6F7A74)}
.dg .muted{fill:var(--d-muted,#6F7A74)}
.dg .h-in{fill:var(--d-accent-ink,#A13A10);font-weight:500}
.dg .h-out{font-weight:500}
.dg .title{font-weight:700;letter-spacing:-.01em}
.dg .caption{font-size:15px;font-weight:600}
.dg .cellname{font-size:13.5px;font-weight:600}
]]></style>
<defs><marker id="a-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-in" d="M0,1 L10,5 L0,9 z"/></marker><marker id="a-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-out" d="M0,1 L10,5 L0,9 z"/></marker></defs>
<rect class="bg" width="1280" height="810"/>
<text class="mono muted" x="40" y="44">THE ICR IN A COUNTRY&#x27;S CAMPAIGN SYSTEMS</text>
<text class="mono" x="40" y="116">PLAN AND COLLECT</text>
<text class="sub" x="40" y="136">Countries keep the</text>
<text class="sub" x="40" y="152">tools they use</text>
<text class="mono" x="40" y="412">RECORD</text>
<text class="sub" x="40" y="432">One registry and</text>
<text class="sub" x="40" y="448">system of record</text>
<text class="mono" x="40" y="687">REPORT AND ANALYSE</text>
<text class="sub" x="40" y="707">National reporting</text>
<text class="sub" x="40" y="723">and analysis</text>
<path class="wire" d="M210,772 h34" marker-end="url(#a-in)"/><text class="sub" x="254" y="776">data going into the ICR</text><path class="wire" d="M420,772 h34" marker-end="url(#a-out)"/><text class="sub" x="464" y="776">data going out of the ICR, or between tools</text>
