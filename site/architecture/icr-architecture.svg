<path id="a-commcare" class="wire" d="M465,160 L465,210 L545,210 L545,330" marker-start="url(#a-out)" marker-end="url(#a-in)"/>
<path id="a-digit" class="wire" d="M639,160 L639,210 L545,210 L545,330" marker-start="url(#a-out)" marker-end="url(#a-in)"/>
<path id="a-icf" class="wire" d="M813,160 L813,210 L545,210 L545,330" marker-start="url(#a-out)" marker-end="url(#a-in)"/>
<path id="a-other" class="wire" d="M987,160 L987,210 L545,210 L545,330" marker-start="url(#a-out)" marker-end="url(#a-in)"/>
<path id="a-cdash" class="wire" d="M1161,160 L1161,210 L545,210 L545,330" marker-start="url(#a-out)"/>
<path id="a-wh" class="wire" d="M880,430 L990,430" marker-end="url(#a-out)"/>
<text class="mono muted" x="935" y="421" text-anchor="middle">PARQUET EXPORT</text>
<path id="a-bi" class="wire" d="M1115,480 L1115,660" marker-end="url(#a-out)"/>
<path id="a-dhis2" class="wire" d="M325,660 L325,530" marker-start="url(#a-out)" marker-end="url(#a-in)"/>
<rect class="box" x="210" y="90" width="162" height="70" rx="3"/><text class="name" x="224" y="117">Crosscut</text><text class="sub" x="224" y="136">Microplanning</text>
<rect class="box" x="384" y="90" width="162" height="70" rx="3"/><text class="name" x="398" y="117">CommCare</text><text class="sub" x="398" y="136">Delivery, supervision</text>
<rect class="box" x="558" y="90" width="162" height="70" rx="3"/><text class="name" x="572" y="117">DIGIT</text><text class="sub" x="572" y="136">Malaria campaigns</text>
<rect class="box" x="732" y="90" width="162" height="70" rx="3"/><text class="name" x="746" y="130.0">ICF</text>
<rect class="box" x="906" y="90" width="162" height="70" rx="3"/><text class="name" x="920" y="117">Other tools</text><text class="sub" x="920" y="136">ODK, DHIS2 Tracker</text>
<rect class="box" x="1080" y="90" width="162" height="70" rx="3"/><text class="name" x="1094" y="117">Dashboards</text><text class="sub" x="1094" y="136">Campaign monitoring</text>
<rect class="icr" x="210" y="330" width="670" height="200" rx="4"/>
<text class="title" x="230" y="364" font-size="24">ICR</text><text class="sub" x="280" y="363">Integrated Campaign Registry</text><text class="mono h-in" x="860" y="362" text-anchor="end">SYSTEM OF RECORD · HL7 FHIR R4</text>
<rect class="cell" x="230" y="384" width="202" height="130" rx="2"/><text class="name" x="244" y="410">Location registry</text><text class="sub" x="244" y="432">Admin areas, health facilities,</text><text class="sub" x="244" y="448">catchments, settlements</text><text class="code" x="244" y="501">Location · Organization</text>
<rect class="cell" x="444" y="384" width="202" height="130" rx="2"/><text class="name" x="458" y="410">Campaign data</text><text class="sub" x="458" y="432">Campaigns, rounds, targets,</text><text class="sub" x="458" y="448">doses given, coverage</text><text class="code" x="458" y="501">CarePlan · Group · MeasureReport</text>
<rect class="cell" x="658" y="384" width="202" height="130" rx="2"/><text class="name" x="672" y="410">Terminology</text><text class="sub" x="672" y="432">Shared codes, and how each</text><text class="sub" x="672" y="448">tool&#x27;s own codes map to them</text><text class="code" x="672" y="501">CodeSystem · ValueSet · ConceptMap</text>
<rect class="box" x="990" y="380" width="250" height="100" rx="3"/><text class="name" x="1004" y="407">Data warehouse</text><text class="sub" x="1004" y="426">Parquet files, SQL queries</text><text class="code" x="1004" y="468">SQL-on-FHIR</text>
<rect class="box" x="990" y="660" width="250" height="70" rx="3"/><text class="name" x="1004" y="687">Dashboards and BI</text><text class="sub" x="1004" y="706">DuckDB, Superset, Metabase, Power BI</text>
<rect class="box" x="210" y="660" width="230" height="70" rx="3"/><text class="name" x="224" y="687">DHIS2</text><text class="sub" x="224" y="706">National HMIS</text>
<rect class="chip" x="301" y="224" width="230" height="92" rx="2"/>
<text class="mono h-out" x="313" y="241">ICR ↔ TOOLS</text><text class="body" x="313" y="256">locations and catchments</text><text class="body" x="313" y="271">target populations</text><text class="body" x="313" y="286">campaign plans and targets</text><text class="body" x="313" y="301">shared codes</text>
<rect class="chip" x="559" y="224" width="230" height="92" rx="2"/>
<text class="mono h-in" x="571" y="241">TOOLS → ICR</text><text class="body" x="571" y="256">doses and treatments given</text><text class="body" x="571" y="271">coverage</text><text class="body" x="571" y="286">supervision findings</text><text class="body" x="571" y="301">stock</text>
<rect class="chip" x="350" y="545.5" width="216" height="99" rx="2"/>
<text class="mono h-in" x="362" y="562.5">DHIS2 → ICR · FIRST LOAD</text><text class="body" x="362" y="577.5">org units, facilities, history</text>
<text class="mono h-in" x="362" y="599.5">DHIS2 → ICR · AFTER THAT</text><text class="body" x="362" y="614.5">changes, e.g. a new facility</text><text class="body" x="362" y="629.5">campaign data entered in DHIS2</text>
<rect class="chip" x="581" y="564" width="210" height="62" rx="2"/>
<text class="mono h-out" x="593" y="581">ICR → DHIS2</text><text class="body" x="593" y="596">campaign results</text><text class="body" x="593" y="611">as aggregate data</text>
</svg>